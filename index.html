<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Série mensal por carreira</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#fafafa;--card:#fff;--tx:#222;--mut:#666;--bd:#ddd;--grid:rgba(0,0,0,.08);--ac:#1a56db;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214;--card:#1c1d20;--tx:#eceef1;--mut:#9aa0a8;--bd:#33363b;--grid:rgba(255,255,255,.1);--ac:#6ea0ff}}
:root[data-theme="dark"]{--bg:#111214;--card:#1c1d20;--tx:#eceef1;--mut:#9aa0a8;--bd:#33363b;--grid:rgba(255,255,255,.1);--ac:#6ea0ff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);background-color:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
h1{font-size:1rem;line-height:1.3;margin:4px 2px 0;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.chart{position:relative;height:56vh;min-height:280px;max-height:520px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
button,input[type=search]{font:inherit;font-size:16px;min-height:44px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{background:var(--bg)}
input[type=search]{width:100%;padding:0 12px;margin-bottom:8px}
label{display:flex;align-items:center;gap:10px;min-height:48px;padding:4px 6px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--bd)}
label:last-child{border-bottom:0}
label input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--ac)}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
.nm{font-size:14px;line-height:1.3;min-width:0}
.nm small{display:block;color:var(--mut);font-size:12px}
footer{color:var(--mut);font-size:12px;text-align:center;padding:4px 0 8px}
@media (min-width:860px){
 .wrap{flex-direction:row;align-items:flex-start;padding:16px}
 .side{width:340px;flex:none;order:0;max-height:calc(100vh - 32px);overflow:auto}
 .mainc{flex:1;min-width:0;order:1}
 .chart{height:70vh}
}
@media (max-width:859px){.side{order:2}.mainc{order:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="mainc">
    <h1>Ranking de remuneração das carreiras mais populosas de analista no Rio Grande do Sul</h1>
    <div class="card" style="margin-top:8px"><div class="chart"><canvas id="c"></canvas></div></div>
    <footer>*Dados obtidos na transparência estadual.</footer>
  </div>
  <div class="card side">
    <div class="btns">
      <button id="bPadrao" type="button">Padrão</button>
      <button id="bTodas" type="button">Todas</button>
      <button id="bNenhuma" type="button">Nenhuma</button>
    </div>
    <input id="busca" type="search" placeholder="Buscar carreira…" autocomplete="off">
    <div id="lista"></div>
  </div>
</div>
<script>
// ====== CONFIGURE AQUI: séries exibidas por padrão ======
const PADRAO = [
  "Secretaria da Fazenda",
  "Secretaria de Planejamento, Governanca e Gestao"
];
// ========================================================

const meses = [];
for (const a of [2025, 2026]) for (let m = 1; m <= 12; m++) { const s = a * 100 + m; if (s <= 202610) meses.push(String(s)); }
const NM = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const fmtMes = s => NM[+s.slice(4) - 1] + "/" + s.slice(2, 4);

const DADOS = {
"Secretaria da Fazenda":[17899,15059,15048,16316,14430,14759,17710,15958,15791,16808,28265,16390,19054,15531,15196,17647,15746,15558,18344,16124,16262,18300],
"Companhia Est de Processamento de Dados do RS":[14480,13607,12256,17560,11761,11898,12378,11549,12899,19106,11744,15841,15618,14117,12808,18830,12464,12482,13189,12176,13498,20186],
"Secretaria de Planejamento, Governanca e Gestao":[13174,14356,12486,12274,12094,11940,11942,13152,12113,11948,22145,13756,12882,12696,11905,11913,12536,11933,12180,12092,12703,12295],
"Fundacao de Atendimento Socio-educativo":[14701,14684,11354,10748,10397,11201,11243,10812,10593,10952,14309,15131,19213,14427,12984,12184,12126,12284,12808,12402,11756,14459],
"Procuradoria-geral do Estado":[11778,11364,11042,10689,10924,11996,12075,10998,11246,11870,20973,12982,13746,12886,11940,11814,11699,12203,12753,12482,13037,13222],
"Secretaria de Sistemas Penal e Socioeducativo":[12482,11610,11198,11059,11234,11306,11592,12972,11420,11909,22195,13795,11330,10573,10240,10235,10093,10142,10629,10529,10196,10530],
"Instituto de Previdencia do Estado do RS":[10942,11166,11013,10969,10983,11029,10943,11080,11095,11404,21591,12432,10976,11146,11016,11016,11078,11002,11170,11018,11084,11314],
"Secretaria da Saude":[9547,9267,8678,9501,9124,9482,9227,8827,9788,9278,17776,10636,9790,10376,9337,9439,9340,9271,9624,9363,12056,9462],
"Fundacao Est de Protecao Amb Henrique Röessler":[15413,16639,15707,16154,15591,15303,16805,16276,16733,17016,25373,18727,16531,19871,16930,18022,17876,18076,18412,18448,18844,23094]
};

// Qtde de servidores ativos e inativos (10/2026)
const QTD = {"Fundacao Est de Protecao Amb Henrique Röessler":263, "Secretaria da Fazenda":1287, "Companhia Est de Processamento de Dados do RS":882, "Secretaria de Planejamento, Governanca e Gestao":268, "Fundacao de Atendimento Socio-educativo":193, "Procuradoria-geral do Estado":823, "Secretaria de Sistemas Penal e Socioeducativo":742, "Instituto de Previdencia do Estado do RS":217, "Secretaria da Saude":1370};
const nomes = Object.keys(DADOS);
const rot = n => `${n} - ${QTD[n]} servidores`;
const cor = i => `hsl(${(i * 137.5) % 360} 65% 50%)`;
const ativos = new Set(PADRAO.filter(n => n in DADOS));
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

Chart.defaults.font.size = 11;
function tema() {
  Chart.defaults.color = css("--mut");
  Chart.defaults.borderColor = css("--grid");
  if (window.chart) chart.update();
}
tema();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", tema);

const chart = window.chart = new Chart($("c"), {
  type: "line",
  data: {
    labels: meses.map(fmtMes),
    datasets: nomes.map((n, i) => ({
      label: rot(n), data: DADOS[n], borderColor: cor(i), backgroundColor: cor(i),
      borderWidth: 2, pointRadius: 2, pointHoverRadius: 5, tension: 0, hidden: !ativos.has(n)
    }))
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: "nearest", intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        padding: 8, bodyFont: { size: 12 }, titleFont: { size: 12 },
        callbacks: {
          label: c => " " + c.dataset.label.split(" - ")[0] + ": " + c.parsed.y.toLocaleString("pt-BR")
        }
      }
    },
    scales: {
      y: { beginAtZero: true, ticks: { callback: v => v >= 1000 ? (v / 1000).toLocaleString("pt-BR") + " mil" : v } },
      x: { ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 6 } }
    }
  }
});

const lista = $("lista");
const caixas = nomes.map((n, i) => {
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox"><span class="sw" style="background:${cor(i)}"></span><span class="nm"></span>`;
  l.querySelector(".nm").innerHTML = `${n}<small>${QTD[n]} servidores</small>`;
  const cb = l.querySelector("input");
  cb.checked = ativos.has(n);
  cb.onchange = () => { chart.setDatasetVisibility(i, cb.checked); chart.update(); };
  lista.appendChild(l);
  return cb;
});
function aplicar(fn) {
  nomes.forEach((n, i) => { const v = fn(n); caixas[i].checked = v; chart.setDatasetVisibility(i, v); });
  chart.update();
}
$("bPadrao").onclick = () => aplicar(n => PADRAO.includes(n));
$("bTodas").onclick = () => aplicar(() => true);
$("bNenhuma").onclick = () => aplicar(() => false);
$("busca").oninput = e => {
  const q = e.target.value.toLowerCase();
  caixas.forEach((cb, i) => cb.parentElement.style.display = nomes[i].toLowerCase().includes(q) ? "" : "none");
};
</script>
</body>
</html>
